<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#087F73"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#087F73"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>

  <!-- Glowing Heart Healthcare Ribbon Symbol -->
  <path d="M32 52 C 14 38, 8 26, 16 16 C 22 8, 30 12, 32 18 C 34 12, 42 8, 48 16 C 56 26, 50 38, 32 52 Z" 
        fill="url(#heartGrad)" 
        filter="url(#glow)"/>

  <!-- Subtle Medical Cross Accent -->
  <path d="M32 24 V34 M27 29 H37" 
        stroke="#FFFFFF" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        opacity="0.9"/>
</svg>
